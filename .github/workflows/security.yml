name: Security & Build
on:
  push:
    branches: [master]
  pull_request:

jobs:
  scan:
    name: Secret scan + typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets in code tree
        run: |
          if git grep -nIE 'firebase-adminsdk|------BEGIN [A-Z ]*PRIVATE|private_key|AIza[0-9A-Za-z_-]{30,}|gh[pousr]_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}' HEAD -- \
            ':!package-lock.json' ':!README.md'; then
            echo "::error::Possível segredo encontrado no código"
            exit 1
          fi

      - name: Ensure no .env tracked
        run: |
          if git ls-files | grep -qE '^\.env($|\.)'; then
            echo "::error::Arquivo .env versionado (só .env.example é permitido)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build